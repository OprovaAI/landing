<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Oprova AI — 에이전트가 운영하는 회사</title>
<meta name="description" content="개발팀 없이 AI 에이전트로 사업 운영 전환. Oprova가 맞춤 에이전트를 직접 짓고 운영합니다." />
<meta property="og:title" content="Oprova AI" />
<meta property="og:description" content="개발팀 없이 AX. 맞춤 에이전트 구축 + 운영 서비스." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="copy.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="variant-a.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const { lang, setLang } = useLang();

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.documentElement.style.setProperty('--accent', '#6aa8ff');
  }, []);

  useEffect(() => {
    document.documentElement.lang = lang === 'ko' ? 'ko' : 'en';
  }, [lang]);

  return (
    <>
      <TopNav lang={lang} setLang={setLang} />
      <main id="top">
        <VariantA />
      </main>
    </>
  );
}

setTimeout(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}, 80);
</script>
</body>
</html>
